[package]
name = "adoc-hub"
version = "0.2.0"
edition = "2024"
description = "herdr-ranch plugin: every adoc on the ranch network in one browser"
license = "0BSD"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
garage49-tui-iocraft = { git = "https://github.com/garage49/garage49-tui", rev = "6997c5a6ee10504c95e6a555cb7066d755dc8aec" }
iocraft = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
