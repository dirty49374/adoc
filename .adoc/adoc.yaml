# adoc for the adoc repository itself. Plugins come from ./plugins.
plugins:
  - key: TODO
    from: ./plugins/todo
  - key: TASK
    from: ./plugins/task
  - key: KANBAN
    from: ./plugins/kanban
  - key: NOTE
    from: ./plugins/note
  - key: SKETCH
    from: ./plugins/sketch
watch:
  - docs
agent:
  name: adoc-dev
  transport:
    kind: herdr
server:
  host: 0.0.0.0
  port: 7700
