# adoc for the adoc repository itself. Plugins come from ../plugins, so that editing one reloads it. Paths are relative to this file.
plugins:
  NOTE: ../plugins/note
  TODO: ../plugins/todo
  SKETCH: ../plugins/sketch
  TASK: ../plugins/task
  KANBAN: ../plugins/kanban
watch:
  - ../docs
agent:
  name: adoc-dev
  transport:
    kind: herdr
server:
  host: 0.0.0.0
  port: 7700
ui:
  tabs: [NOTE, TODO, SKETCH, TASK, KANBAN]
