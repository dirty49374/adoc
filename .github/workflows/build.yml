# Built by the shared garage49 workflows (rules: garage49/.github RULES.md). One version line:
# root package.json == every package == ranch-plugin Cargo.toml == ranch-plugin/herdr-plugin.toml.
# main push -> checks, packed npm tarballs and adoc-hub binaries as workflow artifacts (snapshot version)
# tag vX.Y.Z on main -> npm publish of the nine @garage49 packages (dependencies first), and one GitHub
#   Release holding the tarballs and adoc-hub-{linux,macos}-{arch}, each with .sha256, plus SHA256SUMS
name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request: {}
  workflow_dispatch: {}
permissions: { contents: write, id-token: write }
jobs:
  npm:
    uses: garage49/.github/.github/workflows/node-build.yml@main
    with:
      packages: '["packages/plugin-kit","packages/webapp","plugins/todo","plugins/task","plugins/kanban","plugins/note","plugins/sketch","packages/core","packages/cli"]'
      checks: 'pnpm check && pnpm test'
    secrets: inherit
  hub:
    uses: garage49/.github/.github/workflows/rust-build.yml@main
    with:
      name: adoc-hub
      package: adoc-hub
      path: ranch-plugin
      targets: '["linux-x86_64","macos-aarch64","macos-x86_64"]'
      version-files: package.json ranch-plugin/herdr-plugin.toml
